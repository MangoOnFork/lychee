<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Can't open page</title>
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/pages.css">
<script src="/shared/icons.js"></script>
<script src="/shared/themes.js"></script>
<script src="/shared/effects.js"></script>
<script src="/shared/page.js"></script>
</head>
<body>
<main class="err">
  <div class="err-card card">
    <div class="head-icon"><i data-icon="warn"></i></div>
    <h1 id="title">This site can't be reached</h1>
    <p id="why"></p>
    <p class="url" id="url"></p>
    <div class="code" id="code"></div>
    <div class="actions">
      <button class="btn primary" id="retry"><i data-icon="reload"></i>Try again</button>
      <button class="btn" id="search"><i data-icon="search"></i>Search for it instead</button>
    </div>
  </div>
</main>
<script src="error.js"></script>
</body>
</html>
