<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bookmarks</title>
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/pages.css">
<script src="/shared/icons.js"></script>
<script src="/shared/themes.js"></script>
<script src="/shared/effects.js"></script>
<script src="/shared/page.js"></script>
</head>
<body>
<main class="page">
  <header class="page-head">
    <div class="head-icon"><i data-icon="bookmark"></i></div>
    <div><h1>Bookmarks</h1><p class="sub" id="sub">Hit the star in the address bar (or Ctrl+D) to save a page</p></div>
  </header>
  <div class="toolbar-row">
    <label class="field"><i data-icon="search"></i><input id="q" placeholder="Search bookmarks" spellcheck="false" autofocus></label>
  </div>
  <div id="grid" class="bm-grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>
<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2>Rename bookmark</h2>
    <div class="field"><input id="dlg-name" maxlength="200" spellcheck="false"></div>
    <div class="actions"><button type="button" class="btn" id="dlg-cancel">Cancel</button><button class="btn primary">Save</button></div>
  </form>
</dialog>
<script src="bookmarks.js"></script>
</body>
</html>
