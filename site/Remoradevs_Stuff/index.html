<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>@remoradev</title>
<link rel="icon" type="image/webp" href="assets/avatar.webp">
<style>
@font-face { font-family: "Satoshi"; font-weight: 500; font-display: swap; src: url(assets/Satoshi-500.woff2) format("woff2"); }
@font-face { font-family: "Satoshi"; font-weight: 700; font-display: swap; src: url(assets/Satoshi-700.woff2) format("woff2"); }

:root {
  --card: rgba(27, 27, 27, .5);
  --text: #fff;
  --bg: #080808;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Satoshi", system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* background video, a bit oversized so it can drift with the mouse */
#bg {
  position: fixed; top: -6%; left: -6%;
  width: 112%; height: 112%;
  object-fit: cover;
  pointer-events: none;
  transition: transform .9s cubic-bezier(.2, .7, .2, 1);
  will-change: transform;
}
/* white aurora haze */
#aurora { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

main {
  position: relative; z-index: 1;
  min-height: 100%;
  display: grid; place-items: center;
  padding: 16px;
}
.card {
  width: min(640px, 100%);
  padding: 35px 15px;
  border-radius: 20px;
  background: var(--card);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  text-align: center;
  animation: fade 1s ease both;
}
@keyframes fade { from { opacity: 0; transform: translateY(14px); } }

.avatar {
  display: block; margin: 0 auto;
  width: 118px; height: 118px;
  border-radius: 50%;
  object-fit: cover;
  user-select: none; -webkit-user-drag: none;
}
h1 {
  margin: 8px 0 0;
  font-size: 39.5px; font-weight: 700; letter-spacing: -.01em;
  line-height: 1.35;
  text-shadow: 0 0 16.5px #fff;
}
h3 {
  margin: 4px 0 0;
  font-size: 19px; font-weight: 500;
  line-height: 1.35;
}

@media (max-width: 480px) {
  h1 { font-size: 32px; }
  h3 { font-size: 17px; }
  .avatar { width: 100px; height: 100px; }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  #bg { transition: none; }
}
</style>
</head>
<body>
<video id="bg" src="assets/bg.mp4" autoplay muted loop playsinline disablepictureinpicture preload="auto"></video>
<canvas id="aurora"></canvas>

<main>
  <section class="card">
    <img class="avatar" src="assets/avatar.webp" alt="remoradev">
    <h1>remoradev</h1>
    <h3>Game Dev Of 3 Years</h3>
  </section>
</main>

<script>
// Background drifts gently against the mouse.
const bg = document.getElementById('bg');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!still) {
  addEventListener('pointermove', (e) => {
    const x = (e.clientX / innerWidth - .5) * -24;
    const y = (e.clientY / innerHeight - .5) * -16;
    bg.style.transform = `translate(${x}px, ${y}px)`;
  });
}

// Aurora: soft white bands that slowly ripple across the top of the page.
const cv = document.getElementById('aurora');
const cx = cv.getContext('2d');
let W = 0, H = 0;
function size() {
  const d = Math.min(devicePixelRatio || 1, 1.5);
  W = cv.width = Math.round(innerWidth * d / 2);   // half-res: it is blurred anyway
  H = cv.height = Math.round(innerHeight * d / 2);
}
size(); addEventListener('resize', size);

const bands = Array.from({ length: 5 }, (_, i) => ({
  y: .04 + i * .055,
  amp: .03 + Math.random() * .04,
  len: .6 + Math.random() * .9,
  speed: .05 + Math.random() * .08,
  phase: Math.random() * 10,
  thick: .12 + Math.random() * .1,
  alpha: .10 + Math.random() * .08,
}));

function draw(t) {
  t /= 1000;
  cx.clearRect(0, 0, W, H);
  // general haze, thickest at the top
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(222,222,222,1)');
  g.addColorStop(.16, 'rgba(180,180,180,.93)');
  g.addColorStop(.3, 'rgba(150,150,150,.6)');
  g.addColorStop(.46, 'rgba(150,150,150,.12)');
  g.addColorStop(.58, 'rgba(150,150,150,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  cx.filter = `blur(${Math.round(H * .04)}px)`;
  for (const b of bands) {
    cx.beginPath();
    const steps = 48;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const y = (b.y + Math.sin(u * Math.PI * 2 / b.len + t * b.speed * 6 + b.phase) * b.amp
               + Math.sin(u * 7 + t * b.speed * 3) * b.amp * .3) * H;
      i ? cx.lineTo(u * W, y) : cx.moveTo(0, y);
    }
    for (let i = steps; i >= 0; i--) {
      const u = i / steps;
      const y = (b.y + b.thick * (.6 + .4 * Math.sin(u * 5 + t * b.speed * 4 + b.phase))
               + Math.sin(u * Math.PI * 2 / b.len + t * b.speed * 6 + b.phase) * b.amp) * H;
      cx.lineTo(u * W, y);
    }
    cx.closePath();
    const pulse = b.alpha * (.75 + .25 * Math.sin(t * .4 + b.phase));
    cx.fillStyle = `rgba(255,255,255,${pulse})`;
    cx.fill();
  }
  cx.filter = 'none';
  if (!still) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
